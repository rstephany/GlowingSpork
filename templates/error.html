{% extends "base.html" %}
{% block title %}{{ code }} — {{ branding.site_title }}{% endblock %}

{% block extra_style %}
<style>
  .error-wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 4rem 2rem; text-align: center; position: relative; z-index: 1;
  }
  .error-code {
    font-family: 'Orbitron', monospace; font-size: clamp(5rem, 15vw, 9rem);
    font-weight: 900; line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px rgba(0,180,255,0.3);
    text-shadow: none; margin-bottom: 1rem;
  }
  .error-msg { font-size: 1.1rem; color: rgba(200,230,255,0.6); margin-bottom: 2rem; }
</style>
{% endblock %}

{% block content %}
<div class="error-wrap">
  <div class="error-code">{{ code }}</div>
  <p class="error-msg">{{ message }}</p>
  <a href="/" class="btn">Return to Base</a>
</div>
{% endblock %}
